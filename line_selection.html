<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASOBRICK FACTORY - هەڵبژاردنی هێڵ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Rudaw&family=Segoe+UI:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-color: #1a237e;
            --secondary-color: #c62828;

            --gradient-bg: linear-gradient(135deg, #901717 10%, #1a237e 90%);
        }

        body {
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rudaw', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            overflow: hidden;
            position: relative;
        }

        * {
            font-family: 'Rudaw', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        /* Abstract Background Shapes */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 0;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            bottom: 50px;
            right: -50px;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(30px) scale(1.05);
            }
        }

        /* Glassmorphism Card */
        .selection-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .welcome-text {
            color: #000000;
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .instruction-text {
            color: #4b5563;
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .line-options {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .line-card {
            flex: 1;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #e5e7eb;
            position: relative;
            overflow: hidden;
        }

        .line-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .line-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .line-card:hover::before {
            opacity: 1;
        }

        .line-card.line-2 {
            border-color: #3b82f6;
        }

        .line-card.line-2:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .line-card.line-2 .icon-circle {
            background: #dbeafe;
            color: #2563eb;
        }

        .line-card.line-1 {
            border-color: #10b981;
        }

        .line-card.line-1:hover {
            border-color: #059669;
            background: #ecfdf5;
        }

        .line-card.line-1 .icon-circle {
            background: #d1fae5;
            color: #059669;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 20px auto;
            transition: transform 0.3s ease;
        }

        .line-card:hover .icon-circle {
            transform: scale(1.1);
        }

        .line-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .line-desc {
            font-size: 0.95rem;
            color: #6b7280;
            font-weight: 500;
        }

        .brand-logo-img {
            max-width: 100px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .user-greeting {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="user-greeting" id="userGreeting" style="display: none;">
        <i class="bi bi-person-circle"></i>
        <span id="greetingName">بەکارهێنەر</span>
        <button class="logout-btn ms-3" onclick="logout()"><i class="bi bi-box-arrow-right"></i> دەرچوون</button>
    </div>

    <div class="selection-card">
        <img src="logo.png" alt="ASOBRICK Logo" class="brand-logo-img">
        <h1 class="welcome-text">بەخێربێیت</h1>
        <p class="instruction-text">تکایە ئەو هێڵە هەڵبژێرە کە دەتەوێت کاری لەسەر بکەیت</p>

        <div class="line-options">
            <!-- Line 2 Option (Old factory) -->
            <div class="line-card line-2" onclick="selectLine('line2')">
                <div class="icon-circle">
                    <i class="bi bi-building"></i>
                </div>
                <div class="line-title">هێڵی ٢</div>
                <div class="line-desc">ئامێرەکان و کارمەندەکانی هێڵی دووەم </div>
            </div>

            <!-- Line 1 Option (New factory) -->
            <div class="line-card line-1" onclick="selectLine('line1')">
                <div class="icon-circle">
                    <i class="bi bi-building-add"></i>
                </div>
                <div class="line-title">هێڵی ١</div>
                <div class="line-desc">ئامێرەکان و کارمەندەکانی هێڵی یەکەم</div>
            </div>
        </div>
    </div>

    <script>
        // Check Login
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            // Display greeting
            const greetingEl = document.getElementById('userGreeting');
            const nameEl = document.getElementById('greetingName');
            nameEl.textContent = currentUser.username;
            greetingEl.style.display = 'flex';

            const allowedLine = currentUser.allowedLine || 'both';

            function lockLineCard(lineClass) {
                const lineCard = document.querySelector(`.line-card.${lineClass}`);
                if (lineCard) {
                    lineCard.style.opacity = '0.5';
                    lineCard.style.cursor = 'not-allowed';
                    lineCard.style.borderColor = '#9ca3af';

                    const iconCircle = lineCard.querySelector('.icon-circle');
                    if (iconCircle) {
                        iconCircle.innerHTML = '<i class="bi bi-lock-fill"></i>';
                        iconCircle.style.background = '#f3f4f6';
                        iconCircle.style.color = '#6b7280';
                    }
                }
            }

            // Lock lines based on allowedLine
            if (allowedLine === 'line1') {
                lockLineCard('line-2');
            } else if (allowedLine === 'line2') {
                lockLineCard('line-1');
            }
        }


        function selectLine(lineId) {
            const allowedLine = currentUser.allowedLine || 'both';

            if (lineId === 'line1' && allowedLine !== 'line1' && allowedLine !== 'both') {
                alert('ببورە، ناتوانیت بچیتە هێڵی ١');
                return;
            }

            if (lineId === 'line2' && allowedLine !== 'line2' && allowedLine !== 'both') {
                alert('ببورە، ناتوانیت بچیتە هێڵی ٢');
                return;
            }

            // Update user object with selected line
            currentUser.line = lineId;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));

            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        }

        // Logout Logic
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
